<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CK Logo Showcase</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #060919;
            color: #f1f5f9;
            padding: 2rem;
            min-height: 100vh;
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #00d4ff, #00ffaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 2.5rem;
        }

        .showcase-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
            max-width: 1100px;
            margin: 0 auto;
        }

        .card {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 20px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            backdrop-filter: blur(12px);
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: #e2e8f0;
            text-align: center;
        }

        .preview-box {
            width: 180px;
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 16px;
            margin-bottom: 1.5rem;
        }

        .preview-box.transparent {
            background-image: linear-gradient(45deg, #1e293b 25%, transparent 25%), 
                              linear-gradient(-45deg, #1e293b 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #1e293b 75%), 
                              linear-gradient(-45deg, transparent 75%, #1e293b 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            background-color: #0f172a;
        }

        .preview-box.dark {
            background-color: #1e1f29;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .preview-box.light {
            background-color: #f8fafc;
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        .tab-sim {
            background: #1e1f29;
            border-radius: 8px 8px 0 0;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: none;
            width: 100%;
            max-width: 240px;
            margin-bottom: 1.5rem;
        }

        .tab-title {
            font-size: 0.85rem;
            color: #cbd5e1;
        }

        .sizes-row {
            display: flex;
            gap: 1.5rem;
            align-items: flex-end;
            margin-top: 0.5rem;
        }

        .size-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .size-label {
            font-size: 0.75rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <h1>CK Vector Logo Showcase</h1>
    <p class="subtitle">Exact vector geometry with electric cyan-teal gradient fill</p>

    <!-- Hidden reusable SVG definition -->
    <svg style="display: none;">
        <defs>
            <linearGradient id="ckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#00d4ff"/>
                <stop offset="100%" stop-color="#00ffaa"/>
            </linearGradient>
        </defs>
        <g id="userCkLogo" fill="none" stroke="url(#ckGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
            <!-- C -->
            <path d="M 129.96 81.43 A 60 60 0 1 0 129.96 158.57"/>
            <!-- K -->
            <line x1="156" y1="60" x2="156" y2="180"/>
            <line x1="156" y1="120" x2="216" y2="60"/>
            <line x1="156" y1="120" x2="216" y2="180"/>
        </g>
    </svg>

    <div class="showcase-grid">

        <!-- Card 1: Transparent Canvas -->
        <div class="card">
            <div class="card-title">Transparent Grid Canvas</div>
            
            <div class="preview-box transparent">
                <svg width="140" height="140" viewBox="0 0 240 240">
                    <use href="#userCkLogo"/>
                </svg>
            </div>

            <div class="sizes-row">
                <div class="size-item">
                    <svg width="48" height="48" viewBox="0 0 240 240">
                        <use href="#userCkLogo"/>
                    </svg>
                    <span class="size-label">48px</span>
                </div>
                <div class="size-item">
                    <svg width="32" height="32" viewBox="0 0 240 240">
                        <use href="#userCkLogo"/>
                    </svg>
                    <span class="size-label">32px</span>
                </div>
                <div class="size-item">
                    <svg width="16" height="16" viewBox="0 0 240 240">
                        <use href="#userCkLogo"/>
                    </svg>
                    <span class="size-label">16px</span>
                </div>
            </div>
        </div>

        <!-- Card 2: Browser Dark Tab Simulation -->
        <div class="card">
            <div class="card-title">Dark Tab Bar (16px Real Tab Size)</div>
            
            <div class="tab-sim">
                <svg width="18" height="18" viewBox="0 0 240 240">
                    <use href="#userCkLogo"/>
                </svg>
                <span class="tab-title">Charan Kumar - Software...</span>
            </div>

            <div class="preview-box dark">
                <svg width="140" height="140" viewBox="0 0 240 240">
                    <use href="#userCkLogo"/>
                </svg>
            </div>
        </div>

        <!-- Card 3: Browser Light Tab Simulation -->
        <div class="card">
            <div class="card-title">Light Tab Bar (16px Real Tab Size)</div>
            
            <div class="tab-sim" style="background: #e2e8f0; border-color: #cbd5e1;">
                <svg width="18" height="18" viewBox="0 0 240 240">
                    <use href="#userCkLogo"/>
                </svg>
                <span class="tab-title" style="color: #1e293b;">Charan Kumar - Software...</span>
            </div>

            <div class="preview-box light">
                <svg width="140" height="140" viewBox="0 0 240 240">
                    <use href="#userCkLogo"/>
                </svg>
            </div>
        </div>

    </div>

</body>
</html>
